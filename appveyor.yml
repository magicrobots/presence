version: 0.0.1.{build}

# Test against Node.js 20 LTS
environment:
  AWS_KEY_EMAIL:
    secure: +dPvvxxksecEbtXXj0WeS8eMrQiS91BrStU+Gkn8kAo=
  AWS_SECRET_EMAIL:
    secure: FYJljDShng/1GYBj8YtIgs1NZmgwc0Eab34hLx4QNbTB4bTN6z4bfQ90XgTnvSnM
  nodejs_version: "20"
  buildVersion: $(APPVEYOR_BUILD_NUMBER)

services:
  - postgresql

# Install scripts. (runs after repo cloning)
install:
  # Get Node.js 20 LTS
  - ps: Install-Product node $env:nodejs_version
  # install all workspace dependencies
  - npm install

# Post-install test scripts.
test_script:
  # Output useful info for debugging.
  - node --version
  - npm --version
  # run typecheck before tests
  - npm run typecheck
  # run tests
  - npm test --workspaces --if-present


# build.
build_script:
  # add .env file containing aws keys (written to api workspace root)
  - echo AWS_KEY=%AWS_KEY_EMAIL% > api/.env
  - echo AWS_SECRET=%AWS_SECRET_EMAIL% >> api/.env
  - echo BUILD_NUMBER=%buildVersion% >> api/.env
  # build workspaces in dependency order: types → api → frontend
  - npm run build -w packages/types
  - npm run build -w api
  - npm run build -w frontend

# create artifacts for deployment (frontend S3 deploy step).
artifacts:
  - path: frontend/dist/
    name: fred
    type: zip
